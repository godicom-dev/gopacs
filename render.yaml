# Paid instance: a free web service has no disk, so the archive would
# vanish on restart. Render publishes one HTTP port. DIMSE stays on the
# private network and is not reachable from a modality on the internet.
services:
  - type: web
    name: gopacs
    runtime: docker
    plan: 0.5c-512mb
    healthCheckPath: /system
    envVars:
      - key: PORT
        value: 10000
    disk:
      name: gopacs-data
      mountPath: /var/data
      sizeGB: 10
